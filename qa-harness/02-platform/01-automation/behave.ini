[behave]
# ---------------------------------------------------------------------------
# Behave configuration file
# Run BDD tests with:  behave
# Filter by tag:       behave --tags=@api
#                      behave --tags=@<project>
# Run one feature:     behave features/httpbin.feature
# ---------------------------------------------------------------------------

# Where Behave looks for .feature files and the steps/ folder
paths = features

# Show stdout/stderr output from steps in real-time (useful for debugging).
# Set to true to suppress noise in CI if preferred.
stdout_capture = false
stderr_capture = false
log_capture    = false

# Default format: 'pretty' for local, 'progress' for compact CI output.
# Override on the command line: behave --format=progress
format = pretty
