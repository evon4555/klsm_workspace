# Prometheus configuration for Test Automation Dashboard
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Locust exporter — metrics exposed by prometheus_client in locustfile.py.
  # Force IPv4 (127.0.0.1) — locustfile.py calls start_http_server(addr="0.0.0.0")
  # which only listens on IPv4. Using "localhost" makes Prometheus try [::1]
  # first on Windows and fail with "No connection", silently breaking scrape.
  - job_name: "locust"
    static_configs:
      - targets: ["127.0.0.1:9646"]
    metrics_path: /metrics
    # 1s scrape so short ramps (e.g. 100u/10rps = 10s) render as a curve,
    # not a step, in Grafana.
    scrape_interval: 1s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
