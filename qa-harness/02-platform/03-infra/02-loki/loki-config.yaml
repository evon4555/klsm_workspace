# Loki single-binary config for Windows-native install.
# Matches what was shipped with grafana/loki:2.9.6 image, with Windows paths
# substituted for filesystem storage.
#
# Start:    <qa-harness>\infra\start-loki.bat
# Stop:     Ctrl+C in the launching shell (or stop the service if registered).
# Verify:   curl http://127.0.0.1:3100/ready

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: D:/loki/data
  storage:
    filesystem:
      chunks_directory: D:/loki/data/chunks
      rules_directory: D:/loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false

ruler:
  alertmanager_url: http://localhost:9093
