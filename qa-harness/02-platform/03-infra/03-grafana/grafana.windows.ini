; Grafana overrides for the Windows-native install.
; Pass this file via infra\start-grafana.bat.

[paths]
; Provisioning is set by infra\start-grafana.bat via GF_PATHS_PROVISIONING.

[server]
http_addr = 0.0.0.0
http_port = 3000

[security]
admin_user = admin
admin_password = admin
allow_embedding = true
cookie_samesite = none

[auth.anonymous]
enabled = true
org_role = Viewer

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console file
level = info
