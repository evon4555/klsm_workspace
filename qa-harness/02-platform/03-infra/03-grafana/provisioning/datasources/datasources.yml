apiVersion: 1

datasources:
  # All three observability services (Grafana / Prometheus / Loki) run natively
  # on Windows since 2026-05-27, so they share localhost loopback.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://localhost:3100
    editable: false
